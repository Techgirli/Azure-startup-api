# k8s/helm/values.yaml
replicaCount: 2

image:
  repository: startupacrstg.azurecr.io/api
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: LoadBalancer    # ← AKS provisions a free Standard LB
  port: 80
  targetPort: 3000

ingress:
  enabled: false        # ← skip ingress for free tier   
  className: ""          # ← use default (Azure Load Balancer)
  host: "api.my-startup.com"
  tls: true
  annotations:
    # Remove all appgw annotations
    # For TLS, use cert-manager or Azure Key Vault cert   

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

env:
  LOG_LEVEL: "info"
  NODE_ENV: "production"

# Azure Workload Identity (replaces GCP IAM SA annotation)
serviceAccount:
  name: startup-api-sa
  annotations:
    azure.workload.identity/client-id: "YOUR_CLIENT_ID_HERE"

networkPolicy:
  enabled: true   