replicaCount: 3

image:
  repository: startupacrprd.azurecr.io/api

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

ingress:
  host: "api.my-startup.com"
  annotations:
    appgw.ingress.kubernetes.io/azure-application-gateway: "appgw-startup-prod"

serviceAccount:
  annotations:
    azure.workload.identity/client-id: "YOUR_PROD_CLIENT_ID"   