name: CD

on:
  push:
    tags: ['v*.*.*']

jobs:
  deploy-staging:
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4
      # OIDC auth — no long-lived service account keys
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
      - name: Push to Artifact Registry
        run: |
          gcloud artifacts repositories set-docker-authentication my-repo
          docker tag my-startup/api:${{ github.sha }} \
            us-docker.pkg.dev/$PROJECT/my-repo/api:${{ github.sha }}
          docker push us-docker.pkg.dev/$PROJECT/my-repo/api:${{ github.sha }}
      - name: Deploy to GKE Staging
        run: |
          gcloud container clusters get-credentials staging-cluster --region us-central1
          helm upgrade --install api ./k8s/helm \
            -f k8s/helm/values-staging.yaml \
            --set image.tag=${{ github.sha }} \
            -n staging

  dast:
    runs-on: ubuntu-24.04
    needs: deploy-staging
    steps:
      - uses: actions/checkout@v4
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          image: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'https://staging.my-startup.com'
          zap_options: '-t https://staging.my-startup.com'

  deploy-production:
    runs-on: ubuntu-24.04
    needs: dast
    environment: production   # ← requires manual approval in GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
      - name: Deploy to GKE Production
        run: |
          gcloud container clusters get-credentials prod-cluster --region us-central1
          helm upgrade --install api ./k8s/helm \
            -f k8s/helm/values-prod.yaml \
            --set image.tag=${{ github.sha }} \
            -n production
      - name: Health Check
        run: |
          for i in $(seq 1 30); do
            curl -sf https://prod.my-startup.com/health && exit 0
            sleep 10
          done
          echo "Health check failed" && exit 1   