name: Azure-CD

on:
  push:
    tags: ['v*.*.*']

permissions:
  id-token: write
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4

      # OIDC auth — no client secrets, no long-lived credentials
      - name: Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: |
          az acr login --name ${{ vars.AZURE_ACR_NAME }}

      - name: Build & Push to ACR
        run: |
          docker build -t ${{ vars.AZURE_ACR_NAME }}.azurecr.io/api:${{ github.sha }} ./app
          docker push ${{ vars.AZURE_ACR_NAME }}.azurecr.io/api:${{ github.sha }}

      - name: Set up kubectl
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AZURE_STAGING_RG }} \
            --name staging-aks \
            --admin

      - name: Deploy to AKS Staging
        run: |
          helm upgrade --install api ./k8s/helm \
            -f k8s/helm/values-staging.yaml \
            --set image.repository=${{ vars.AZURE_ACR_NAME }}.azurecr.io/api \
            --set image.tag=${{ github.sha }} \
            -n staging

  dast:
    runs-on: ubuntu-24.04
    needs: deploy-staging
    steps:
      - uses: actions/checkout@v4
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          image: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'https://staging.my-startup.com'

  deploy-production:
    runs-on: ubuntu-24.04
    needs: dast
    environment: production   # ← requires manual approval
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AZURE_PROD_RG }} \
            --name prod-aks \
            --admin

      - name: Deploy to AKS Production
        run: |
          helm upgrade --install api ./k8s/helm \
            -f k8s/helm/values-prod.yaml \
            --set image.repository=${{ vars.AZURE_ACR_NAME }}.azurecr.io/api \
            --set image.tag=${{ github.sha }} \
            -n production

      - name: Health Check
        run: |
          for i in $(seq 1 30); do
            curl -sf https://prod.my-startup.com/health && exit 0
            sleep 10
          done
          echo "Health check failed" && exit 1   