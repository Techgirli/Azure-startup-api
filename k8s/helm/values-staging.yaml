replicaCount: 1

image:
  repository: startupacrstg.azurecr.io/api

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

ingress:
  host: "staging.my-startup.com"
  annotations:
    appgw.ingress.kubernetes.io/azure-application-gateway: "appgw-startup-staging"

env:
  LOG_LEVEL: "debug"
  NODE_ENV: "staging"   