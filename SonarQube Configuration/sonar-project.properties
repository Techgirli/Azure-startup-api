sonar.projectKey=my-startup-api
sonar.projectName=Startup API
sonar.projectVersion=1.0

sonar.sources=app/src
sonar.tests=app/tests
sonar.language=js
sonar.javascript.lcov.reportPaths=app/coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.js
sonar.test.inclusions=**/tests/**,**/*.spec.js,**/*.test.js

# Quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Security
sonar.security.hotspots.enable=true   