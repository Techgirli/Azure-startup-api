name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        type: choice
        options:
          - staging
          - production
      revision:
        description: 'Helm revision to rollback to (blank = previous)'
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        run: |
          RG=$([[ "${{ inputs.environment }}" == "staging" ]] && echo "${{ vars.AZURE_STAGING_RG }}" || echo "${{ vars.AZURE_PROD_RG }}")
          CLUSTER=$([[ "${{ inputs.environment }}" == "staging" ]] && echo "staging-aks" || echo "prod-aks")
          az aks get-credentials --resource-group $RG --name $CLUSTER --admin

      - name: Rollback Helm release
        run: |
          REVISION="${{ inputs.revision }}"
          if [ -z "$REVISION" ]; then
            helm rollback api -n ${{ inputs.environment }} --wait --timeout 5m
          else
            helm rollback api $REVISION -n ${{ inputs.environment }} --wait --timeout 5m
          fi

      - name: Verify health
        run: |
          HOST=$(helm get values api -n ${{ inputs.environment }} | grep host | awk '{print $2}' | tr -d '"')
          for i in $(seq 1 30); do
            curl -sf "https://$HOST/health" && exit 0
            sleep 10
          done
          echo "Rollback verification failed" && exit 1   